<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2DF7" />
      <stop offset="100%" stop-color="#B600A8" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="32" height="32" rx="8" fill="#0C0C0C" />
  <!-- Isometric 3D Cube -->
  <!-- Top Face -->
  <polygon points="16,6 25,11 16,16 7,11" fill="url(#grad)" />
  <!-- Left Face -->
  <polygon points="7,11 16,16 16,26 7,21" fill="url(#grad2)" opacity="0.9" />
  <!-- Right Face -->
  <polygon points="16,16 25,11 25,21 16,26" fill="#7928CA" opacity="0.75" />
